[project]
name = "civilwar-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "discord-py>=2.6.4",
    "poethepoet>=0.42.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
indent-width = 2

[tool.poe.tasks]
start  = "dotenvx run -- python main.py"
